name: Deploy Backend (Coolify)

# Coolify clones this repo (read-only deploy key) and builds the single
# multi-process image from ./Dockerfile (api + image-service + ai-services +
# data-sync, started by scripts/start-prod.sh) on every deploy. This workflow
# just triggers that deploy. Traefik (in Coolify) terminates TLS and routes
# api.htownautos.com / link.htownautos.com by FQDN — no SCP/SSH, no GHCR,
# no Cloudflare Tunnel. Env vars live in Coolify, not here.
#
# Required GitHub secrets (set via gh / repo settings):
#   COOLIFY_URL           http://163.192.211.13:8000   (no trailing slash)
#   COOLIFY_TOKEN         Coolify API token
#   COOLIFY_BACKEND_UUID  z1d4qr4dsv6a0vlbmzaa5qer

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: |
          set -euo pipefail
          echo "Triggering Coolify deploy for ${COOLIFY_BACKEND_UUID}…"
          curl --fail-with-body -sS -X GET \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_BACKEND_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_BACKEND_UUID: ${{ secrets.COOLIFY_BACKEND_UUID }}

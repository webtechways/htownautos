name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (amd64)
        run: |
          docker build --platform linux/amd64 -t htownautos-backend:latest .

      - name: Save Docker image
        run: docker save htownautos-backend:latest | gzip > backend.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.tar.gz"
          target: "/tmp"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker load < /tmp/backend.tar.gz
            rm /tmp/backend.tar.gz

            docker stop app 2>/dev/null || true
            docker rm app 2>/dev/null || true

            docker run -d \
              --name app \
              --restart unless-stopped \
              --network htownautos_appnet \
              --env-file ~/htownautos/htownautos-backend/.env.production \
              -p 3000:3000 \
              -p 3002:3002 \
              -p 3003:3003 \
              -p 3004:3004 \
              htownautos-backend:latest

            sleep 15
            docker ps | grep app
            docker image prune -f
            echo "Backend deployed successfully!"
